# docker-compose.production.yml
volumes:
  pg_data_production:
  taski_static_volume:
    name: taski_static_volume

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: haziko/taski_backend
    container_name: taski-backend
    restart: always
    env_file: .env
    depends_on:
      - db
    volumes:
      - taski_static_volume:/backend_static
    networks:
      - default
      - web

  frontend:
    image: haziko/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - taski_static_volume:/frontend_static

networks:
  web:
    external: true
